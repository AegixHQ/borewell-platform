server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that doesn't match a real static file serves
    # index.html, so client-side routing (if/when this app adds a router)
    # doesn't 404 on a direct URL hit or a page refresh. Harmless no-op
    # today since App.jsx does state-based view switching, not URL routing -
    # cheap to get right now rather than a surprise later.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively - Vite fingerprints filenames
    # (e.g. index-Cw9wvOYn.js), so a new deploy naturally gets a new URL
    # and never serves stale JS from a client's cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html itself - it's what points at the current
    # fingerprinted asset URLs, so a stale cached index.html would keep
    # requesting an asset bundle that no longer exists after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
