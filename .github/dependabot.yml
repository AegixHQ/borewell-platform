version: 2
updates:
  # Python services: the Dockerfiles install from unpinned ranges, so without
  # this nothing tells you a dependency has a known vulnerability.
  - package-ecosystem: pip
    directory: /services/platform-spine
    schedule: { interval: weekly }
    # SQLAlchemy 2.1 makes postgresql:// mean psycopg v3 (we ship psycopg2); stay on 2.0.x until that is migrated.
    ignore:
      - dependency-name: sqlalchemy
        versions: [\">=2.1\"]
  - package-ecosystem: pip
    directory: /services/quotation
    schedule: { interval: weekly }
    # SQLAlchemy 2.1 makes postgresql:// mean psycopg v3 (we ship psycopg2); stay on 2.0.x until that is migrated.
    ignore:
      - dependency-name: sqlalchemy
        versions: [\">=2.1\"]
  - package-ecosystem: pip
    directory: /services/resource-network
    schedule: { interval: weekly }
    # SQLAlchemy 2.1 makes postgresql:// mean psycopg v3 (we ship psycopg2); stay on 2.0.x until that is migrated.
    ignore:
      - dependency-name: sqlalchemy
        versions: [\">=2.1\"]
  - package-ecosystem: pip
    directory: /services/payments-data
    schedule: { interval: weekly }
    # SQLAlchemy 2.1 makes postgresql:// mean psycopg v3 (we ship psycopg2); stay on 2.0.x until that is migrated.
    ignore:
      - dependency-name: sqlalchemy
        versions: [\">=2.1\"]
  - package-ecosystem: docker
    directory: /services/platform-spine
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /services/quotation
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /services/resource-network
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /services/payments-data
    schedule: { interval: weekly }
  # npm: minor/patch only. A major bump (react 19, vite 8, eslint 10, expo 58)
  # is a deliberate migration - Expo packages must match SDK 57 - not something
  # to merge off a bot PR.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/borewell-native
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Versions the Expo SDK pins together (react 0.88 / react 19.3 broke the
      # bundle under SDK 57). Move them only with `npx expo install` on an SDK upgrade.
      - dependency-name: "react"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor"]
    groups:
      native-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
