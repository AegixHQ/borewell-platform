version: 2
updates:
  # Python services: the Dockerfiles install from unpinned ranges, so without
  # this nothing tells you a dependency has a known vulnerability.
  - package-ecosystem: pip
    directory: /services/platform-spine
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /services/quotation
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /services/resource-network
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /services/payments-data
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /services/platform-spine
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /services/quotation
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /services/resource-network
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /services/payments-data
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/borewell-native
    schedule: { interval: weekly }
    groups:
      native-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
