name: CI - payments-data

on:
  push:
    paths:
      - 'services/payments-data/**'
      - 'packages/contracts/openapi/payments-data.yaml'
  pull_request:
    paths:
      - 'services/payments-data/**'
      - 'packages/contracts/openapi/payments-data.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: services/payments-data
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: services/payments-data
        run: pytest
