name: CI - deployment config

# Validates that docker-compose.yml, docker-compose.prod.yml, and every
# Dockerfile in the repo are actually buildable - not just "looks right."
# This is the one thing the local sandbox this repo was largely built in
# could NOT verify directly (no Docker daemon available there) - see
# docs/deployment/PRODUCTION.md and the Dockerfiles' own comments for
# where that honest gap was flagged. This workflow closes it: GitHub
# Actions runners have a real Docker daemon, so this is the first place
# these Dockerfiles get an actual `docker build`, not just a read-through.

on:
  push:
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'docker-compose.tls.yml'
      - '.env.prod.example'
      - 'tools/go-live/**'
      - 'packages/contracts/openapi/*.yaml'
      - 'infra/**'
      - 'Makefile'
      - 'services/*/Dockerfile'
      - 'apps/web-app/Dockerfile'
      - 'apps/web-app/Dockerfile.dev'
      - 'apps/web-app/nginx.conf'
      - '.github/workflows/ci-deployment.yml'
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'docker-compose.tls.yml'
      - '.env.prod.example'
      - 'tools/go-live/**'
      - 'packages/contracts/openapi/*.yaml'
      - 'infra/**'
      - 'Makefile'
      - 'services/*/Dockerfile'
      - 'apps/web-app/Dockerfile'
      - 'apps/web-app/Dockerfile.dev'
      - 'apps/web-app/nginx.conf'
      - '.github/workflows/ci-deployment.yml'

# Least privilege: no job here pushes code, comments, or publishes anything.
permissions:
  contents: read

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-compose.yml (dev)
        run: docker compose -f docker-compose.yml config --quiet

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Go-live tooling tests and gateway route coverage
        run: |
          pip install pytest pyyaml
          python -m pytest tools/go-live/tests -q
          python tools/go-live/check_gateway_routes.py

      - name: Generate a throwaway .env.prod the way a user would
        # `make prod-init` is the documented first step, so CI runs it. The
        # result must pass the same preflight a real deploy runs.
        run: |
          python tools/go-live/init_env.py --domain api.ci-test.in --email ci@ci-test.in
          python tools/go-live/preflight.py

      - name: Validate docker-compose.prod.yml (plain HTTP)
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod config --quiet

      - name: Validate docker-compose.prod.yml + docker-compose.tls.yml (what make prod-deploy runs)
        run: docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml --env-file .env.prod config --quiet

      - name: The unfilled template must NOT start a stack
        run: |
          if docker compose -f docker-compose.prod.yml --env-file .env.prod.example config --quiet 2>/dev/null; then
            echo "The template validated without a domain - the required-variable guards are gone"; exit 1
          fi

  build-backend-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [platform-spine, quotation, resource-network, payments-data]
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.service }} image
        run: docker build -t borewell-${{ matrix.service }}:ci ./services/${{ matrix.service }}

  build-frontend-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build web-app production image (nginx, multi-stage)
        run: docker build -t borewell-web-app-prod:ci -f apps/web-app/Dockerfile .

      - name: Build web-app dev image (Vite dev server)
        run: docker build -t borewell-web-app-dev:ci -f apps/web-app/Dockerfile.dev .
