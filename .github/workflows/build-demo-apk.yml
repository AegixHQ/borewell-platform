name: Build demo APK

# Builds an installable Android APK of apps/borewell-native, no Expo account
# needed.
#   - Default (and every push to demo-apk): DEMO mode - built-in sample data,
#     no backend, simulated payments, no Google sign-in.
#   - Run workflow with `lan_host` set (e.g. 192.168.1.50): a LIVE build that
#     talks to the four services on that machine (ports 8001-8004, plain
#     http - fine on a home network, not for production), with real Razorpay
#     Checkout and, if `google_web_client_id` is given, "Continue with Google".
# The APK lands on a draft release; the release notes include the signing
# key's SHA-1, which Google's Android OAuth client needs.

on:
  workflow_dispatch:
    inputs:
      lan_host:
        description: "LIVE build: IP of the machine running the services (blank = demo build)"
        required: false
        default: ""
      google_web_client_id:
        description: "LIVE build: Google *Web application* OAuth client ID (blank = no Google button)"
        required: false
        default: ""
  push:
    branches: [demo-apk]

permissions:
  contents: write   # only to attach the APK to a draft release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/borewell-native
    env:
      EXPO_PUBLIC_DEMO: ${{ inputs.lan_host == '' && '1' || '0' }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ inputs.google_web_client_id }}
      LAN_HOST: ${{ inputs.lan_host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-audit --no-fund
      - name: Point a live build at the LAN services
        if: env.LAN_HOST != ''
        run: |
          {
            echo "EXPO_PUBLIC_PLATFORM_SPINE_URL=http://$LAN_HOST:8001"
            echo "EXPO_PUBLIC_QUOTATION_URL=http://$LAN_HOST:8002"
            echo "EXPO_PUBLIC_RESOURCE_NETWORK_URL=http://$LAN_HOST:8003"
            echo "EXPO_PUBLIC_PAYMENTS_URL=http://$LAN_HOST:8004"
            echo "EXPO_PUBLIC_ALLOW_INSECURE_HTTP=1"
          } >> "$GITHUB_ENV"
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Allow plain-http to the LAN (live build only)
        if: env.LAN_HOST != ''
        run: sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
      - name: Allow slow Gradle download
        run: sed -i 's/^networkTimeout=.*/networkTimeout=180000/' android/gradle/wrapper/gradle-wrapper.properties
      - name: Build the APK (arm64 phones)
        working-directory: apps/borewell-native/android
        run: |
          # services.gradle.org occasionally answers 504; retry the whole build.
          for attempt in 1 2 3 4 5; do
            ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a && exit 0
            echo "Attempt $attempt failed; retrying in 45s"; sleep 45
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: borewell-demo-apk
          path: apps/borewell-native/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Attach the APK to a draft release (easy download)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/borewell-native/android/app/build/outputs/apk/release
        run: |
          KIND=$([ -n "$LAN_HOST" ] && echo live || echo demo)
          cp app-release.apk "borewell-$KIND.apk"
          SHA1=$(keytool -list -v -keystore "$GITHUB_WORKSPACE/apps/borewell-native/android/app/debug.keystore" \
            -storepass android -alias androiddebugkey 2>/dev/null | grep "SHA1:" | head -1 | sed 's/.*SHA1: *//')
          gh release create "$KIND-apk-${{ github.run_number }}" "borewell-$KIND.apk" \
            --draft --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Borewell $KIND APK (build ${{ github.run_number }})" \
            --notes "Android APK ($KIND build), arm64 phones. Signing key SHA-1 (for the Google Android OAuth client, package in.aegix.borewell): $SHA1"
