name: CI - resource-network

on:
  push:
    paths:
      - 'services/resource-network/**'
      - 'packages/contracts/openapi/resource-network.yaml'
  pull_request:
    paths:
      - 'services/resource-network/**'
      - 'packages/contracts/openapi/resource-network.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: services/resource-network
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: services/resource-network
        run: pytest
