name: CI - frontend

on:
  push:
    paths:
      - 'apps/**'
  pull_request:
    paths:
      - 'apps/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [contractor-app, resource-owner-app, customer-app, shared-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: apps/${{ matrix.app }}
        run: npm install
      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: npm run build --if-present
