name: CI - platform-spine

on:
  push:
    paths:
      - 'services/platform-spine/**'
      - 'packages/contracts/openapi/platform-spine.yaml'
      - 'tools/contract-check/**'
  pull_request:
    paths:
      - 'services/platform-spine/**'
      - 'packages/contracts/openapi/platform-spine.yaml'
      - 'tools/contract-check/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install service dependencies
        working-directory: services/platform-spine
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: services/platform-spine
        run: pytest
      - name: Lint (ruff) - catches unused imports, dead code
        run: |
          pip install ruff
          ruff check services/platform-spine
      - name: Contract conformance check
        run: |
          pip install -r tools/contract-check/requirements.txt
          python tools/contract-check/check_contract.py platform-spine
