openapi: 3.0.3
info:
  title: payments-data
  version: "1.0"
  description: Payments and Split Settlement, Data and Analytics
paths:
  /v1/payments:
    post:
      summary: Create a payment for an approved quotation. Idempotent by idempotency_key. Customer only.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [job_id, quotation_id, amount, idempotency_key]
              properties:
                job_id: { type: string, format: uuid }
                quotation_id: { type: string, format: uuid }
                # string, not number: must match the quotation service's
                # total_estimate to the paisa (SRS section 6). A JSON number
                # here would round-trip through float and make that exact
                # comparison meaningless - see app/schemas.py's comment.
                amount: { type: string, format: decimal, example: "95450.00" }
                idempotency_key: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '201':
          description: Payment created (or the existing one, if idempotency_key was already used)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Quotation not approved, or amount does not match the approved total
        '403':
          description: Only customers may create payments
        '409':
          description: |
            IDEMPOTENCY_KEY_CONFLICT - the key was already used by another customer, or for a different job/quotation/amount.
            ALREADY_PAID - this quotation already has a completed payment.
            (A quotation with a still-pending payment returns that payment instead of opening a second one.)
        '502':
          description: Could not reach the quotation service to verify the quotation
    get:
      summary: List payments visible to the current user (own payments for customers, all for contractor/admin)
      responses:
        '200':
          description: Payment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
  /v1/payments/{payment_id}:
    get:
      summary: Get a single payment
      parameters:
        - name: payment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '403':
          description: Not the owning customer
        '404':
          description: Payment not found
  /v1/payments/{payment_id}/confirm:
    post:
      summary: |
        Manual admin override to mark a payment completed. The real,
        primary confirmation path is POST /v1/payments/webhook (Razorpay's
        signed webhook) - this endpoint is now the FALLBACK for support/
        pilot cases where the webhook didn't fire or a manual correction
        is genuinely needed (e.g. a customer paid via a channel outside
        the app, verified out of band). Still admin-only; never wire a
        frontend "confirm" button to this - real confirmation flows
        through the webhook.
      parameters:
        - name: payment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Payment marked completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '403':
          description: Only admin may confirm (placeholder auth, see summary)
        '404':
          description: Payment not found
  /v1/payments/{payment_id}/fail:
    post:
      summary: |
        Manual admin override to mark a payment failed. Same fallback
        role as /confirm above - the real path is the webhook reporting
        payment.failed.
      parameters:
        - name: payment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Payment marked failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '403':
          description: Only admin may mark failed (placeholder auth, see summary)
        '404':
          description: Payment not found
  /v1/payments/{payment_id}/create-order:
    post:
      summary: |
        Create a Razorpay Order for this payment and return the order_id
        the frontend needs to open Razorpay Checkout. Customer only, and
        only the payment's own customer. Payment must be 'pending' (a
        completed or failed payment cannot get a new order). Idempotent
        in practice: if an order already exists for this payment, returns
        the existing order_id rather than creating a second one at
        Razorpay (a customer re-opening the payment screen must not spawn
        duplicate Razorpay orders for the same payment).
      parameters:
        - name: payment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Razorpay order ready for checkout
          content:
            application/json:
              schema:
                type: object
                properties:
                  razorpay_order_id: { type: string }
                  razorpay_key_id: { type: string, description: "Public key ID - safe to expose to the frontend, needed to open Razorpay Checkout" }
                  amount_paise: { type: integer, description: "Amount in paise (INR minor unit) - what Razorpay Checkout expects" }
                  currency: { type: string, example: "INR" }
        '400':
          description: Payment is not in 'pending' status
        '403':
          description: Not the owning customer
        '404':
          description: Payment not found
        '409':
          description: This payment is set to cash (PAYMENT_IS_CASH)
        '502':
          description: Razorpay order-creation call failed

  /v1/payments/{payment_id}/choose-cash:
    post:
      summary: |
        The customer will pay the contractor in cash. The payment stays
        'pending' (method becomes 'cash') until a contractor confirms the
        cash arrived. Customer only, and only the payment's own customer.
      parameters:
        - { name: payment_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Payment, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '403': { description: Not the owning customer }
        '404': { description: Payment not found }
        '409': { description: "Payment is not pending (PAYMENT_NOT_PENDING) or an online Razorpay order is already open (ONLINE_ORDER_OPEN)" }
  /v1/payments/{payment_id}/choose-online:
    post:
      summary: Change back from cash to online before a contractor has confirmed any cash. Customer only (own payment).
      parameters:
        - { name: payment_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Payment, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '403': { description: Not the owning customer }
        '404': { description: Payment not found }
        '409': { description: Payment is not pending (PAYMENT_NOT_PENDING) }
  /v1/payments/{payment_id}/confirm-cash:
    post:
      summary: |
        A contractor (or admin) confirms the cash arrived. The only way a cash
        payment becomes 'completed'; fires the same payment.completed event as
        an online payment. Idempotent.
      parameters:
        - { name: payment_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Payment (completed), content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '403': { description: Caller is not a contractor or admin }
        '404': { description: Payment not found }
        '409': { description: "Not a cash payment (NOT_A_CASH_PAYMENT) or not pending (PAYMENT_NOT_PENDING)" }
  /v1/payments/{payment_id}/reject-cash:
    post:
      summary: |
        A contractor (or admin) says the cash did not arrive. Closes the
        payment as 'failed'; the customer can start a new payment.
      parameters:
        - { name: payment_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Payment, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '403': { description: Caller is not a contractor or admin }
        '404': { description: Payment not found }
        '409': { description: "Not a cash payment (NOT_A_CASH_PAYMENT) or already completed (PAYMENT_ALREADY_COMPLETED)" }
  /v1/payments/{payment_id}/verify:
    post:
      summary: |
        Complete an online payment from the values Razorpay Checkout returns to
        the app. The signature (HMAC-SHA256 of "order_id|payment_id" with the
        Razorpay API key secret) is verified server-side, so a client cannot
        claim a payment that did not happen. The webhook remains the backup.
        Customer only (own payment). Idempotent.
      parameters:
        - { name: payment_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [razorpay_order_id, razorpay_payment_id, razorpay_signature]
              properties:
                razorpay_order_id: { type: string }
                razorpay_payment_id: { type: string }
                razorpay_signature: { type: string }
      responses:
        '200': { description: Payment (completed), content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '400': { description: "Order does not belong to this payment (ORDER_MISMATCH) or bad signature (INVALID_SIGNATURE)" }
        '403': { description: Not the owning customer }
        '404': { description: Payment not found }
        '409': { description: This payment is set to cash (PAYMENT_IS_CASH) }
        '502': { description: Razorpay keys are not configured (GATEWAY_NOT_CONFIGURED) }

  /v1/payments/webhook:
    post:
      summary: |
        Razorpay webhook receiver - the real, primary payment-confirmation
        path (replaces the admin-gated /confirm and /fail placeholders as
        the source of truth). Authenticates via HMAC-SHA256 signature in
        the X-Razorpay-Signature header (RAZORPAY_WEBHOOK_SECRET), NOT an
        app-issued JWT - Razorpay's server calls this directly, it has no
        Borewell Platform login. Handles payment.captured (-> completed)
        and payment.failed (-> failed) events; any other event type is
        acknowledged with 200 and ignored, not rejected, since Razorpay
        retries on non-2xx and this endpoint should never cause a retry
        storm over an event type it simply doesn't act on yet.
      parameters:
        - name: X-Razorpay-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        description: Razorpay's webhook payload - see their docs for the full event schema; only payment.captured/payment.failed are acted on
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Event processed (or acknowledged and ignored, if not a handled event type)
        '400':
          description: Signature missing or invalid - request rejected before any processing

  /v1/analytics/estimate-accuracy:
    get:
      summary: "NOT IMPLEMENTED YET - quoted-vs-actual variance reporting, US-11 (Should priority, not Must). Declared here so the contract documents the intended future shape."
      responses:
        '200':
          description: Aggregated variance report (not implemented in MVP)
          content:
            application/json:
              schema:
                type: object
components:
  schemas:
    Payment:
      type: object
      properties:
        payment_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        quotation_id: { type: string, format: uuid }
        amount: { type: string, format: decimal, example: "95450.00" }
        status: { type: string, enum: [pending, completed, failed] }
        razorpay_order_id: { type: string, nullable: true, description: "Set once POST /v1/payments/{id}/create-order has been called" }
        razorpay_payment_id: { type: string, nullable: true, description: "Set once the webhook reports a captured/failed payment attempt" }
        method: { type: string, enum: [online, cash], description: "How the customer settles. A 'cash' payment stays pending until a contractor confirms it." }
        cash_confirmed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
