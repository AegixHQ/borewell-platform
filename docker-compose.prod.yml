# Production compose file - single VM, per Architecture doc section 10:
# "a single small cloud VM (or equivalent) running the same docker-compose.yml
# used locally - deliberately simple. A single-contractor pilot does not
# justify a managed container orchestration platform." This file is the
# promoted, hardened version of that same idea - not a rewrite, not
# Kubernetes. See docs/deployment/PRODUCTION.md for the full deploy runbook.
#
# Usage:
#   cp .env.prod.example .env.prod
#   # edit .env.prod - every CHANGE_ME value must be replaced, see that
#   # file's own comments for how to generate each one
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Differences from docker-compose.yml (dev), and why each one exists:
#   - No host-exposed Postgres/Redis ports. Dev compose exposes 5432-5435
#     and 6379 for local debugging (psql, redis-cli from the host). In
#     production those ports have no reason to be reachable from outside
#     the Docker network - every real client goes through each service's
#     own HTTP API, never the database directly (Architecture doc section
#     4: "Services never call each other's databases directly").
#   - Every JWT_SECRET is a real interpolated secret from .env.prod, not
#     the shared literal "dev-only-secret-change-in-production" every dev
#     service currently uses. All 4 services verify the same customer/
#     contractor/resource_owner/admin JWTs (issued only by platform-spine -
#     Architecture doc section 6), so all 4 need the SAME secret value,
#     just no longer a hardcoded one committed to the repo.
#   - restart: unless-stopped on every service - dev compose has no
#     restart policy (you want a crashed dev container to stay stopped
#     for you to inspect); production should recover from a container
#     crash without a human re-running `docker compose up`.
#   - No bind-mounted source anywhere - production runs the image that
#     was built, not a live view of the host filesystem.
#   - payments-data gets 3 additional RAZORPAY_* env vars that don't
#     exist in dev compose at all (not a difference in value - dev
#     compose has no equivalent line). Local development against
#     payments-data's create-order/webhook endpoints uses mocked Razorpay
#     calls in tests (see services/payments-data/tests/test_razorpay_*.py)
#     rather than needing real credentials for `make up` - see
#     services/payments-data/app/gateway/razorpay_client.py's docstring
#     for the full integration and its honest caveat about not having
#     been checked against live Razorpay docs.
#   - No web-app service. The real frontend (mobile + desktop) now lives
#     in a separate repository and is integrated later, not built or
#     served from here - see infra/gateway/README.md for exactly what
#     that frontend repo needs to know to reach this backend (base URL,
#     CORS entry, JWT contract), and docs/BACKEND_INTEGRATION.md for the
#     full API surface. This file's only job now is exposing the 4
#     backend services behind one stable entry point.
#   - A traefik gateway service, genuinely wired via Docker labels on
#     each backend service below (infra/gateway/traefik.yml, the static
#     file this used to point at, is now unused - Docker-provider labels
#     are the source of truth). This is Architecture doc section 4's
#     "a single API Gateway is the only entry point frontends talk to"
#     actually implemented, not just described. Each service's own port
#     (8001-8004) stays exposed too, deliberately - a mobile app can't
#     do the browser-relative path routing the gateway enables, and
#     direct per-service access is genuinely useful while integrating a
#     new frontend repo against this one for the first time. Nothing
#     about adding the gateway removes or changes the direct-port path.

services:
  postgres-platform-spine:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform_spine
      POSTGRES_USER: borewell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_platform_spine:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borewell -d platform_spine"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-quotation:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quotation
      POSTGRES_USER: borewell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_quotation:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borewell -d quotation"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-resource-network:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: resource_network
      POSTGRES_USER: borewell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_resource_network:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borewell -d resource_network"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-payments-data:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: payments_data
      POSTGRES_USER: borewell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_payments_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borewell -d payments_data"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    # Real single entry point (Architecture doc section 4), not the
    # unused infra/gateway/traefik.yml static file - routing is defined
    # entirely via Docker labels on each backend service below, which is
    # Traefik's Docker provider reading this same compose file rather
    # than a second config file that could drift from it.
    image: docker.io/library/traefik:v3.1
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      # Only route services that opt in via traefik.enable=true (each
      # backend service below) - without this, Traefik would try to
      # route every container in the stack, including Postgres and
      # Redis, which have no HTTP API to route to.
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      # TLS is deliberately not configured here - see
      # docs/deployment/PRODUCTION.md's TLS section for the two real
      # options (a managed cert via a DNS provider, or fronting this
      # entire VM with a CDN/proxy like Cloudflare in front of port 80)
      # and why neither is wired by default: both require a real domain
      # to exist first, which a pilot VM may not have on day one. Until
      # then this serves plain HTTP - acceptable for integration testing
      # against a new frontend repo, not for real customer traffic.
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      # condition: service_healthy, not just service_started - now that
      # each backend below has a real healthcheck (added alongside this),
      # Traefik waits for /healthz to actually respond before starting to
      # route to it, rather than potentially routing to a container
      # that's still running `alembic upgrade head` (see each service's
      # Dockerfile CMD) and not yet serving requests.
      platform-spine:
        condition: service_healthy
      quotation:
        condition: service_healthy
      resource-network:
        condition: service_healthy
      payments-data:
        condition: service_healthy

  platform-spine:
    build: ./services/platform-spine
    restart: unless-stopped
    depends_on:
      postgres-platform-spine:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://borewell:${POSTGRES_PASSWORD}@postgres-platform-spine:5432/platform_spine
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MINUTES: "60"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      QUOTATION_SERVICE_URL: http://quotation:8000
      # Optional. Set BOTH to create the first admin on next start, then
      # remove the password from .env.prod (see app/bootstrap.py).
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Auth rate limits are per client IP. Leave forwarded-header trust OFF
      # while clients can reach :8001 directly (a direct caller can forge
      # X-Forwarded-For). Turn it on only when ALL traffic comes through
      # Traefik - otherwise every user shares the gateway's IP.
      RATE_LIMIT_TRUST_FORWARDED_FOR: ${RATE_LIMIT_TRUST_FORWARDED_FOR:-0}
    ports:
      - "8001:8000"
    healthcheck:
      # Python, not curl - python:3.11-slim (this service's base image,
      # see services/platform-spine/Dockerfile) doesn't ship curl/wget,
      # and installing one just for this would bloat the image for a
      # single healthcheck call. Verified for real (see
      # infra/monitoring/README.md) that this exits 0 against a real
      # responding server and non-zero when nothing's listening.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # PathPrefix, not StripPrefix - main.py's own routes already start
      # with /v1/, and platform-spine has no other prefix to strip (this
      # is genuinely the service's real path, not a gateway-only alias).
      - "traefik.http.routers.platform-spine.rule=PathPrefix(`/v1/auth`) || PathPrefix(`/v1/jobs`)"
      - "traefik.http.services.platform-spine.loadbalancer.server.port=8000"

  quotation:
    build: ./services/quotation
    restart: unless-stopped
    depends_on:
      postgres-quotation:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://borewell:${POSTGRES_PASSWORD}@postgres-quotation:5432/quotation
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      RESOURCE_NETWORK_URL: http://resource-network:8000
      PLATFORM_SPINE_URL: http://platform-spine:8000
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.quotation.rule=PathPrefix(`/v1/pricing-rules`) || PathPrefix(`/v1/quotations`)"
      - "traefik.http.services.quotation.loadbalancer.server.port=8000"

  resource-network:
    build: ./services/resource-network
    restart: unless-stopped
    depends_on:
      postgres-resource-network:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://borewell:${POSTGRES_PASSWORD}@postgres-resource-network:5432/resource_network
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.resource-network.rule=PathPrefix(`/v1/resources`) || PathPrefix(`/v1/bookings`) || PathPrefix(`/v1/service-areas`)"
      - "traefik.http.services.resource-network.loadbalancer.server.port=8000"

  payments-data:
    build: ./services/payments-data
    restart: unless-stopped
    depends_on:
      postgres-payments-data:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://borewell:${POSTGRES_PASSWORD}@postgres-payments-data:5432/payments_data
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      QUOTATION_SERVICE_URL: http://quotation:8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
    ports:
      - "8004:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # /v1/payments/webhook is Razorpay's callback target, not a
      # frontend call - included here because it shares the same
      # /v1/payments prefix as every real payments-data route, not
      # because a frontend hits this path directly. If you front this
      # VM with a domain, point Razorpay's webhook config at
      # https://<domain>/v1/payments/webhook (through this gateway, port
      # 80/443) rather than the direct :8004 port - the direct port
      # still works too, but the gateway path is the one that survives
      # this VM's port layout changing later.
      - "traefik.http.routers.payments-data.rule=PathPrefix(`/v1/payments`)"
      - "traefik.http.services.payments-data.loadbalancer.server.port=8000"

  prometheus:
    # Scrapes /metrics from all 4 backend services (each exposes it via
    # prometheus-fastapi-instrumentator - see each service's main.py,
    # right after its GZipMiddleware registration). Config lives in
    # infra/monitoring/prometheus.yml, validated with the real promtool
    # binary before being added here (Prometheus's own config-check
    # tool), not just hand-written and assumed correct.
    image: docker.io/prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      platform-spine:
        condition: service_healthy
      quotation:
        condition: service_healthy
      resource-network:
        condition: service_healthy
      payments-data:
        condition: service_healthy
    # No host port exposed by default - Grafana (below) is the intended
    # way to look at this data. Prometheus's own UI is still useful for
    # raw PromQL debugging; uncomment to reach it directly at
    # http://<vm>:9090 if you want that without going through Grafana.
    # ports:
    #   - "9090:9090"

  grafana:
    # Provisioned, not clicked-through: infra/monitoring/grafana/provisioning/
    # wires the Prometheus datasource and auto-loads
    # infra/monitoring/grafana/dashboards/borewell-overview.json on
    # first boot - opening Grafana for the first time already shows
    # real panels (service up/down, request rate, error rate, p95
    # latency, status-code breakdown), not an empty default screen
    # asking you to configure a datasource by hand.
    image: docker.io/grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      # CHANGE_ME here too, same discipline as every other secret in
      # this file - Grafana's own login, not reused from anything else.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Anonymous viewing off by default - this dashboard shows request
      # volume and error rates, not customer data directly, but there's
      # no reason to leave it unauthenticated by default; flip this in
      # .env.prod if you genuinely want a public status-page-style view.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards-json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pg_platform_spine:
  pg_quotation:
  pg_resource_network:
  pg_payments_data:
  prometheus_data:
  grafana_data:
