version: "3.9"

services:
  postgres-platform-spine:
    image: docker.io/library/postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: platform_spine
      POSTGRES_USER: borewell
      POSTGRES_PASSWORD: borewell
    volumes:
      - pg_platform_spine:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U borewell -d platform_spine" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-quotation:
    image: docker.io/library/postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: quotation
      POSTGRES_USER: borewell
      POSTGRES_PASSWORD: borewell
    volumes:
      - pg_quotation:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U borewell -d quotation" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-resource-network:
    image: docker.io/library/postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: resource_network
      POSTGRES_USER: borewell
      POSTGRES_PASSWORD: borewell
    volumes:
      - pg_resource_network:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U borewell -d resource_network" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-payments-data:
    image: docker.io/library/postgres:16-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: payments_data
      POSTGRES_USER: borewell
      POSTGRES_PASSWORD: borewell
    volumes:
      - pg_payments_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U borewell -d payments_data" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  platform-spine:
    build: ./services/platform-spine
    depends_on:
      postgres-platform-spine:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://borewell:borewell@postgres-platform-spine:5432/platform_spine
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-secret-change-in-production
      JWT_EXPIRY_MINUTES: "60"
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:5175"
      QUOTATION_SERVICE_URL: http://quotation:8000
    ports:
      - "8001:8000"

  quotation:
    build: ./services/quotation
    depends_on:
      postgres-quotation:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://borewell:borewell@postgres-quotation:5432/quotation
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-secret-change-in-production
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:5175"
      RESOURCE_NETWORK_URL: http://resource-network:8000
      PLATFORM_SPINE_URL: http://platform-spine:8000
    ports:
      - "8002:8000"

  resource-network:
    build: ./services/resource-network
    depends_on:
      postgres-resource-network:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://borewell:borewell@postgres-resource-network:5432/resource_network
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-secret-change-in-production
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:5175"
    ports:
      - "8003:8000"

  payments-data:
    build: ./services/payments-data
    depends_on:
      postgres-payments-data:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://borewell:borewell@postgres-payments-data:5432/payments_data
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-secret-change-in-production
      QUOTATION_SERVICE_URL: http://quotation:8000
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:5175"
    ports:
      - "8004:8000"

  web-app:
    build:
      context: .
      dockerfile: apps/web-app/Dockerfile.dev
    depends_on:
      - platform-spine
      - quotation
      - resource-network
      - payments-data
    environment:
      # These are BROWSER-facing URLs (the customer's/contractor's browser
      # calls them directly, per the KNOWN DEVIATION documented in
      # apps/shared-ui/src/platform.js - no gateway exists yet). They must
      # be host-mapped localhost ports, NOT Docker service names - the
      # browser runs outside this compose network and can't resolve
      # "platform-spine" as a hostname.
      VITE_PLATFORM_SPINE_URL: http://localhost:8001
      VITE_QUOTATION_URL: http://localhost:8002
      VITE_RESOURCE_NETWORK_URL: http://localhost:8003
      VITE_PAYMENTS_URL: http://localhost:8004
    volumes:
      # Bind-mount source for hot reload - node_modules stays in the
      # image (anonymous volume), not overwritten by the host mount,
      # since the host may not have run `npm install` itself.
      - ./apps/web-app:/repo/apps/web-app
      - ./apps/shared-ui:/repo/apps/shared-ui
      - /repo/apps/web-app/node_modules
      - /repo/apps/shared-ui/node_modules
    ports:
      - "5173:5173"

volumes:
  pg_platform_spine:
  pg_quotation:
  pg_resource_network:
  pg_payments_data:
