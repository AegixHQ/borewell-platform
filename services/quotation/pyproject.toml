[project]
name = "quotation"
version = "0.1.0"
description = "Borewell Platform - quotation service (Location Intelligence and Estimation Engine, Quotation and Pricing Engine)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.1.9,<2.2",
    "alembic>=1.20.1",
    "psycopg2-binary>=2.9",
    "pydantic>=2.14.3",
    "redis>=8.1.0",
    "pyjwt>=2.15.1",
    "httpx>=0.27",
    "prometheus-fastapi-instrumentator>=8.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
